name: Deploy Backend API

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "packages/bookingapp-lib/**"
      - ".github/workflows/deploy-backend_api.yml"
      - "package.json"
      - "pnpm-workspace.yaml"

  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend_api.yml"

  workflow_dispatch:

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Check for migrations
        run: |
          if [ -z "$(ls -A backend/database/migrations/* 2>/dev/null)" ]; then
            echo "No migrations found, skipping..."
            exit 0
          fi
          echo "Found migrations:"
          ls -la backend/database/migrations/

      - name: Run migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Running database migrations..."
          if pnpm run db:migrate:up; then
            echo "Migrations completed successfully"
            echo "migration_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "Migration failed with exit code $?"
            echo "migration_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Check migration status
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "::error::Database migrations failed! Deployment will not proceed."
          echo "Please check the migration logs above for details."
          exit 1

  backend:
    name: Type Check and Build Backend API
    runs-on: ubuntu-latest
    needs: migrate
    if: needs.migrate.result == 'success' || needs.migrate.result == 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Type check backend API
        run: pnpm nx run backend-api:lint

      - name: Build backend API
        run: pnpm nx build backend-api

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package

          # Copy compiled code
          cp -r dist deploy-package/

          # Create package.json with all production dependencies (without file: reference)
          cat > deploy-package/package.json << 'EOF'
          {
            "name": "bookingapp-api",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node dist/backend/api/server.js"
            },
            "engines": {
              "node": "20.x"
            },
            "dependencies": {
              "cors": "^2.8.5",
              "dotenv": "^16.3.1",
              "express": "^5.1.0",
              "pg": "^8.11.3"
            }
          }
          EOF

          # Install production dependencies in deploy package
          cd deploy-package
          npm install --production --no-audit --no-fund

          # Manually install the shared library by copying it to node_modules
          mkdir -p node_modules/@azucar_1/bookingapp
          cp -r ../../packages/bookingapp-lib/dist node_modules/@azucar_1/bookingapp/
          cp ../../packages/bookingapp-lib/package.json node_modules/@azucar_1/bookingapp/

          cd ..

          # Disable builds on Azure (we ship prebuilt artifacts)
          echo "[config]" > deploy-package/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT=false" >> deploy-package/.deployment

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package
